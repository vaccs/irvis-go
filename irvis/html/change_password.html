<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password - IRVIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #f7f7f7; 
      margin: 0; 
      padding: 20px;
    }
    .container { 
      max-width: 500px; 
      margin: 40px auto; 
      background: #fff; 
      padding: 32px; 
      border-radius: 8px; 
      box-shadow: 0 2px 8px #ccc; 
    }
    h2 { 
      text-align: center; 
      color: #333;
      margin-bottom: 24px;
    }
    .error { 
      color: #d32f2f; 
      text-align: center; 
      margin-bottom: 16px; 
      padding: 8px;
      background: #ffebee;
      border-radius: 4px;
      display: none;
    }
    .error.show {
      display: block;
    }
    .success { 
      color: #2e7d32; 
      text-align: center; 
      margin-bottom: 16px; 
      padding: 8px;
      background: #e8f5e8;
      border-radius: 4px;
      display: none;
    }
    .success.show {
      display: block;
    }
    label { 
      display: block; 
      margin-bottom: 6px; 
      font-weight: bold; 
      color: #555;
    }
    input[type="password"] { 
      width: 100%; 
      padding: 12px; 
      margin: 0 0 16px 0; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      box-sizing: border-box;
      font-size: 14px;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #8d6e63;
      box-shadow: 0 0 0 2px rgba(141, 110, 99, 0.1);
    }
    button { 
      width: 100%; 
      padding: 12px; 
      background: #8d6e63; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-size: 16px; 
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { 
      background: #6d4c41; 
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .nav-links {
      text-align: center;
      margin-top: 20px;
    }
    .nav-links a {
      color: #8d6e63;
      text-decoration: none;
      margin: 0 10px;
    }
    .nav-links a:hover {
      color: #6d4c41;
      text-decoration: underline;
    }
    .password-requirements {
      font-size: 12px;
      color: #666;
      margin-bottom: 16px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    .password-requirements ul {
      margin: 4px 0;
      padding-left: 20px;
    }
    .password-requirements li {
      margin: 2px 0;
    }
  </style>
  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      const success = params.get('success');
      
      if (error) {
        const errorDiv = document.getElementById('error-msg');
        errorDiv.textContent = decodeURIComponent(error);
        errorDiv.classList.add('show');
      }
      
      if (success) {
        const successDiv = document.getElementById('success-msg');
        successDiv.textContent = decodeURIComponent(success);
        successDiv.classList.add('show');
      }
    };

    function validateForm() {
      const currentPassword = document.getElementById('current-password').value;
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      
      const errorDiv = document.getElementById('error-msg');
      errorDiv.classList.remove('show');
      
      // Check if current password is provided
      if (!currentPassword) {
        errorDiv.textContent = 'Current password is required';
        errorDiv.classList.add('show');
        return false;
      }
      
      // Check if new password is provided
      if (!newPassword) {
        errorDiv.textContent = 'New password is required';
        errorDiv.classList.add('show');
        return false;
      }
      
      // Check password length
      if (newPassword.length < 6) {
        errorDiv.textContent = 'New password must be at least 6 characters long';
        errorDiv.classList.add('show');
        return false;
      }
      
      // Check if passwords match
      if (newPassword !== confirmPassword) {
        errorDiv.textContent = 'New passwords do not match';
        errorDiv.classList.add('show');
        return false;
      }
      
      // Check if new password is different from current
      if (currentPassword === newPassword) {
        errorDiv.textContent = 'New password must be different from current password';
        errorDiv.classList.add('show');
        return false;
      }
      
      return true;
    }
  </script>
</head>
<body>
  <div class="container">
    <h2>Change Password</h2>
    <div id="error-msg" class="error"></div>
    <div id="success-msg" class="success"></div>
    
    <div class="password-requirements">
      <strong>Password Requirements:</strong>
      <ul>
        <li>Minimum 6 characters</li>
        <li>Must be different from current password</li>
        <li>Both new password fields must match</li>
      </ul>
    </div>
    
    <form method="POST" action="/irvis/change_password" onsubmit="return validateForm();">
      <label for="current-password">Current Password:</label>
      <input type="password" id="current-password" name="current_password" placeholder="Enter current password" required>
      
      <label for="new-password">New Password:</label>
      <input type="password" id="new-password" name="new_password" placeholder="Enter new password" required minlength="6">
      
      <label for="confirm-password">Confirm New Password:</label>
      <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm new password" required minlength="6">
      
      <button type="submit">Change Password</button>
    </form>
    
    <div class="nav-links">
      <a href="/irvis">← Home</a>
    </div>
  </div>
</body>
</html>
