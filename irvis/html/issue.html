<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Submit GitHub Issue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background: #f7f7f7; }
    .container { max-width: 500px; margin: 60px auto; background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px #ccc; }
    h2 { text-align: center; }
    .error { color: #d32f2f; text-align: center; margin-bottom: 16px; }
    .success { color: #388e3c; text-align: center; margin-bottom: 16px; }
    input[type="text"], textarea, select { width: 100%; padding: 10px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #8d6e63; color: white; border: none; border-radius: 4px; font-size: 16px; margin-bottom: 10px; cursor: pointer; }
    button:hover { background: #6d4c41; }
    .button-container { display: flex; flex-direction: column; gap: 10px; }
    .cancel-button { background: #8d6e63; color: white; text-decoration: none; display: block; text-align: center; padding: 10px; border-radius: 4px; font-size: 16px; }
    .cancel-button:hover { background: #6d4c41; }
  </style>
  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      const success = params.get('success');
      if (error) {
        document.getElementById('error-msg').textContent = error;
        document.getElementById('error-msg').style.display = 'block';
      }
      if (success) {
        document.getElementById('success-msg').textContent = success;
        document.getElementById('success-msg').style.display = 'block';
      }
    };
  </script>
</head>
<body>
  <div class="container">
    <h2>Submit GitHub Issue</h2>
    <div id="error-msg" class="error" style="display:none;"></div>
    <div id="success-msg" class="success" style="display:none;"></div>
    <form method="POST" action="/irvis/issue">
      <label for="repo">Repository:</label>
      <select id="repo" name="repo" required>
        <option value="irvis-go">irvis-go</option>
        <option value="irvis_flutter">irvis_flutter</option>
      </select>
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" required>
      <label for="body">Description:</label>
      <textarea id="body" name="body" rows="6" required></textarea>
      <div class="button-container">
        <button type="submit">Submit Issue</button>
        <a href="/irvis" class="cancel-button">Home</a>
      </div>
    </form>
  </div>
</body>
</html>
